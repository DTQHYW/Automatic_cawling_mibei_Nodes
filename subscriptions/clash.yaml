mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enabled: true
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
proxies: []
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🎯 全球直连
  - ♻️ 自动选择
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies: []
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
rules:
- DOMAIN-SUFFIX,local,DIRECT
- IP-CIDR,127.0.0.0/8,DIRECT
- IP-CIDR,172.16.0.0/12,DIRECT
- IP-CIDR,192.168.0.0/16,DIRECT
- IP-CIDR,10.0.0.0/8,DIRECT
- GEOIP,CN,DIRECT
- MATCH,🚀 节点选择
