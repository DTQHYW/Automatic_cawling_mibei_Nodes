mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enabled: true
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
proxies:
- name: HK - HK01 - udptoos.com
  type: vmess
  server: 192.0.2.1
  port: 443
  uuid: uuid-uuid-uuid-uuid
  alterId: 0
  cipher: auto
  network: ws
  tls: true
  ws-path: /path
  ws-headers:
    Host: example.com
- name: US - US01 - udptoos.com
  type: ss
  server: 192.0.2.2
  port: 8388
  cipher: aes-256-gcm
  password: password123
- name: JP - JP01 - udptoos.com
  type: trojan
  server: 192.0.2.3
  port: 443
  password: trojan-password
  sni: trojan.example.com
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🎯 全球直连
  - ♻️ 自动选择
  - HK - HK01 - udptoos.com
  - US - US01 - udptoos.com
  - JP - JP01 - udptoos.com
- name: ♻️ 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - HK - HK01 - udptoos.com
  - US - US01 - udptoos.com
  - JP - JP01 - udptoos.com
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
rules:
- DOMAIN-SUFFIX,local,DIRECT
- IP-CIDR,127.0.0.0/8,DIRECT
- IP-CIDR,172.16.0.0/12,DIRECT
- IP-CIDR,192.168.0.0/16,DIRECT
- IP-CIDR,10.0.0.0/8,DIRECT
- GEOIP,CN,DIRECT
- MATCH,🚀 节点选择
